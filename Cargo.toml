[package]
name = "openband"
version = "1.0.0"
edition = "2024"
authors = ["OpenBand Contributors"]
license = "MIT"
description = "Native Linux GUI desktop application for interactive 1D semiconductor device simulation"

[dependencies]
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.31"
egui_plot = "0.31"
serde = { version = "1.0", features = ["derive"] }
